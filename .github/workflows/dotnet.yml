name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR runs; let `main` runs finish so we never lose a build
# of a merged commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # CI restores/builds/tests CritterCab.slnx explicitly (no glob), so the
      # slnx is the single source of truth for what CI sees. A *.Tests.csproj
      # added to disk but not hand-added to the slnx would silently never run
      # and the check would still go green. This guard fails the build on that
      # drift, keeping test discovery omission-proof as new services land.
      - name: Verify solution completeness
        shell: bash
        run: |
          missing=0
          while IFS= read -r proj; do
            rel="${proj#./}"
            if ! grep -qF "$rel" CritterCab.slnx; then
              echo "::error::Project '$rel' exists on disk but is not referenced in CritterCab.slnx"
              missing=1
            fi
          done < <(find . -name '*.csproj')
          if [ "$missing" -eq 0 ]; then
            echo "All projects on disk are referenced in CritterCab.slnx."
          fi
          exit $missing

      # The .proto files are contracts (ADR-009), so protos/buf.yaml's STANDARD lint (with its
      # one scoped ignore_only) runs on every build rather than only when someone remembers to
      # run buf locally. Lint only: no BSR push, no PR comment (which would need write
      # permissions), and no format or breaking check until those are decided on their own.
      - name: Lint protobuf contracts
        uses: bufbuild/buf-action@v1
        with:
          version: 1.73.0
          input: protos
          lint: true
          format: false
          breaking: false
          push: false
          pr_comment: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore CritterCab.slnx

      - name: Build
        run: dotnet build CritterCab.slnx --no-restore --configuration Release

      # Enforces the list below. A fixture pinning an image this workflow does not pre-pull
      # passes locally and in review, then reintroduces the pull race in CI, where it fails in
      # whichever unrelated suite lost. So: every image literal handed to a Testcontainers
      # *Builder("...") constructor or to .WithImage("...") in a fixture must appear as a
      # `docker pull` line in this file. ryuk is not checked: Testcontainers pins it, no fixture names it.
      - name: Verify pre-pull list covers fixture images
        shell: bash
        run: |
          missing=0
          images=$(grep -rhoE --include='*Fixture.cs' '([A-Za-z]+Builder|WithImage)\("[^"]+"\)' tests \
            | sed -E 's/.*\("([^"]+)"\)/\1/' | sort -u)
          if [ -z "$images" ]; then
            echo "::error::No Testcontainers image literals found under tests/ — the guard's pattern no longer matches the fixtures"
            exit 1
          fi
          for image in $images; do
            if ! grep -qE "^[[:space:]]*docker pull ${image//./\\.}[[:space:]]*$" .github/workflows/dotnet.yml; then
              echo "::error::Fixture image '$image' is not pre-pulled in .github/workflows/dotnet.yml"
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "Every fixture image is pre-pulled:"
            echo "$images"
          fi
          exit $missing

      # Pull every Testcontainers image serially BEFORE the test run, so nothing is fetched from
      # Docker Hub while tests are starting.
      #
      # Why this is needed: xUnit runs the two test assemblies in parallel, and each one stands up
      # its own Testcontainers session — a Ryuk resource reaper plus a Postgres per fixture plus a
      # Kafka broker. Once Dispatch grew its own Kafka-backed fixture (W006 slice 5) that became six
      # containers and two reapers racing to pull at once, and the runner's connection to
      # registry-1.docker.io started timing out mid-pull. The symptom is misleading: the failure
      # surfaces as DockerApiException "context deadline exceeded" inside
      # ResourceReaper.GetAndStartNewAsync, in whichever suite happened to lose the race, so it
      # reads like a broken test rather than a saturated network.
      #
      # After this step the images are local and the fixtures' PullPolicy.Missing makes every pull a
      # no-op. The step above fails the build if a fixture pins an image this list does not pull.
      #
      # The ryuk tag is NOT ours to choose: Testcontainers pins it internally (4.13.0 → 0.14.0,
      # by digest). Re-read it from the package when Testcontainers is bumped, otherwise this line
      # pre-pulls an image nothing uses and the reaper goes back to racing for its own.
      - name: Pre-pull Testcontainers images
        run: |
          docker pull postgres:18-alpine
          docker pull confluentinc/cp-kafka:7.6.1
          docker pull testcontainers/ryuk:0.14.0

      - name: Test
        run: >
          dotnet test CritterCab.slnx
          --no-build
          --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ./test-results
          retention-days: 5
